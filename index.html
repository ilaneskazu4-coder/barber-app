<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ремонт оборудования</title>
    <!-- Подключаем Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 15px;
            margin: 0;
        }
        .card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
        }
        .card h4 { margin: 0 0 5px 0; }
        .card p { margin: 0; font-size: 14px; opacity: 0.8; }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>🛠 Ремонт парикмахерских кресел</h2>
    <p>Быстрый вызов мастера и оценка поломки</p>

    <!-- Прайс / Услуги -->
    <div class="card">
        <h4>Ремонт гидравлики</h4>
        <p>Если кресло не поднимается или спускает</p>
    </div>
    <div class="card">
        <h4>Перетяжка и ремонт обшивки</h4>
        <p>Замена кожзама, устранение порезов</p>
    </div>

    <hr style="margin: 20px 0; border: 0.5px solid #eee;">

    <h3>Оставить заявку</h3>
    <form id="repairForm">
        <label>Что сломалось?</label>
        <select id="service">
            <option value="Гидравлика">Гидравлика / Подъёмник</option>
            <option value="Перетяжка">Перетяжка кресла</option>
            <option value="Каркас / Механика">Каркас / Механика</option>
            <option value="Другое">Другое</option>
        </select>

        <label>Описание проблемы:</label>
        <textarea id="description" rows="3" placeholder="Например: кресло опускается под клиентом..." required></textarea>

        <label>Ваш телефон для связи:</label>
        <input type="tel" id="phone" placeholder="+375 (00) 000-00-00" required>

        <button type="submit">Отправить заявку мастеру</button>
    </form>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем окно на весь экран

        document.getElementById('repairForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const data = {
                service: document.getElementById('service').value,
                description: document.getElementById('description').value,
                phone: document.getElementById('phone').value
            };

            // Отправляем данные обратно боту
            tg.sendData(JSON.stringify(data));
        });
    </script>
</body>
</html>
